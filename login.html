<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Mini WMS</title>
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <main class="login-page">
    <form class="login-card" id="loginForm" novalidate>
      <div class="brand-wrap">
        <div class="brand-icon" aria-hidden="true">
          <span class="brand-dot"></span>
        </div>
        <h1>Sign In</h1>
        <p>Masuk untuk melanjutkan ke dashboard gudang.</p>
      </div>

      <div class="field-group">
        <label for="email">Email</label>
        <div class="input-wrap">
          <span class="field-icon" aria-hidden="true">@</span>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required />
        </div>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="field-icon" aria-hidden="true">•</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required minlength="6" />
          <button class="toggle-password" id="togglePassword" type="button" aria-label="Tampilkan password" aria-pressed="false">Show</button>
        </div>
      </div>

      <button id="loginBtn" class="submit-btn" type="submit">Sign In</button>
      <p id="errorMsg" class="error-msg" role="status" aria-live="polite"></p>

      <p class="signup-link">
        Don’t have an account?
        <a href="#" aria-disabled="true" tabindex="-1">Sign Up</a>
      </p>
    </form>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
