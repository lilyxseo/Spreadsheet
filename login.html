<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Mini WMS</title>
  <link rel="stylesheet" href="./assets/css/base.css" />
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1020;color:#f3f4f6}
    .card{width:100%;max-width:420px;background:#111827;border:1px solid #374151;border-radius:12px;padding:20px}
    .field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
    input{padding:10px 12px;border-radius:8px;border:1px solid #374151;background:#0f172a;color:#fff}
    button{margin-top:16px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
    button[disabled]{opacity:.7;cursor:wait}
    .error{margin-top:10px;color:#fca5a5;min-height:20px}
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Login WMS</h1>
    <p>Masuk dengan akun Supabase.</p>
    <label class="field">Email<input id="email" type="email" required autocomplete="email" /></label>
    <label class="field">Password<input id="password" type="password" required autocomplete="current-password" /></label>
    <button id="loginBtn" type="submit">Login</button>
    <div id="errorMsg" class="error"></div>
  </form>

  <script type="module">
    import { loginWithEmailPassword, getSession } from './assets/js/supabase.js';

    const form = document.getElementById('loginForm');
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    const existingSession = await getSession();
    if (existingSession) location.replace('/dashboard/index.html');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Loading...';

      try {
        const email = emailEl.value.trim();
        const password = passwordEl.value;
        const { error } = await loginWithEmailPassword(email, password);
        if (error) throw error;
        location.replace('/dashboard/index.html');
      } catch (err) {
        errorMsg.textContent = err?.message || 'Login gagal. Coba lagi.';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
