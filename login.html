<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - WMS</title>
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
      <header class="login-header">
        <div class="app-icon" aria-hidden="true">
          <i data-lucide="warehouse"></i>
        </div>
        <h1 id="loginTitle">Sign In</h1>
        <p>Masuk ke Dashboard WMS</p>
      </header>

      <form id="loginForm" class="login-form" novalidate>
        <div class="field-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <i data-lucide="mail"></i>
            <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@company.com" />
          </div>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i data-lucide="lock"></i>
            <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan password" aria-pressed="false">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <button id="loginBtn" class="sign-btn" type="submit">
          <span>Sign In</span>
          <i data-lucide="arrow-right"></i>
        </button>

        <p id="errorMsg" class="error-message" role="status" aria-live="polite" hidden>
          <i data-lucide="alert-circle"></i>
          <span></span>
        </p>
      </form>

      <footer class="login-footer">
        <span>Don't have an account?</span>
        <a href="#" aria-disabled="true">Sign Up</a>
      </footer>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="./login.js"></script>
</body>
</html>
