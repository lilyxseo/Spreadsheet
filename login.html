<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Dashboard WMS</title>
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      const isDark = savedTheme === 'dark';
      document.documentElement.classList.toggle('dark', isDark);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      if (document.body) {
        document.body.classList.toggle('dark', isDark);
        document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./login.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <main class="login-page">
    <section class="login-shell" aria-labelledby="loginTitle">
      <div class="login-form-panel">
        <header class="login-head">
          <div class="login-head-main">
            <div class="app-icon" aria-hidden="true">
              <img src="./assets/goto.png" alt="" class="app-icon-image" />
            </div>
            <h1 id="loginTitle" class="login-title">WMS Goto Living</h1>
          </div>
          <p class="login-subtitle">Warehouse KS Tubun</p>
        </header>

        <button id="googleLoginBtn" class="btn-social" type="button">
          <i data-lucide="chrome" class="google-icon" aria-hidden="true"></i>
          <span>Login with Google</span>
        </button>

        <div class="divider" aria-hidden="true">
          <span>OR</span>
        </div>

        <form id="loginForm" novalidate>
          <p id="formError" class="form-error" role="alert" aria-live="polite" hidden>
            <i data-lucide="alert-circle" aria-hidden="true"></i>
            <span></span>
          </p>
          <div class="form-field">
            <label for="email">Email Address</label>
            <div class="input-wrap" role="group" aria-labelledby="email">
              <i data-lucide="mail" class="input-icon" aria-hidden="true"></i>
              <input class="form-input" id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com" />
            </div>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <div class="input-wrap password-wrap" role="group" aria-labelledby="password">
              <i data-lucide="lock" class="input-icon" aria-hidden="true"></i>
              <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required placeholder="Masukkan password" />
              <button id="togglePassword" class="password-toggle" type="button" aria-label="Tampilkan password" aria-pressed="false">
                <i data-lucide="eye-off"></i>
              </button>
            </div>
          </div>

          <label class="remember-row" for="rememberMe">
            <input id="rememberMe" class="remember-checkbox" type="checkbox" name="rememberMe" />
            <span>Remember me</span>
          </label>

          <button id="loginBtn" class="btn-primary login-btn" type="submit">
            <span>Login</span>
            <i data-lucide="arrow-right"></i>
          </button>

        </form>

        <p class="signup-line">Belum punya akun? <a href="#" aria-label="Sign up">Sign up</a></p>
      </div>
    </section>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
