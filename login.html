<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - WMS</title>
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./login.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
      <header class="login-head">
        <div class="app-icon" aria-hidden="true">
          <i data-lucide="warehouse"></i>
        </div>
        <h1 id="loginTitle">Sign In</h1>
        <p class="login-subtitle">Masuk ke Dashboard WMS</p>
      </header>

      <form id="loginForm" novalidate>
        <div class="form-field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <i data-lucide="mail" class="input-icon" aria-hidden="true"></i>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com" />
          </div>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i data-lucide="lock" class="input-icon" aria-hidden="true"></i>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Masukkan password" />
            <button id="togglePassword" class="toggle-password" type="button" aria-label="Tampilkan password" aria-pressed="false">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <button id="loginBtn" class="btn-primary login-btn" type="submit">
          <span>Sign In</span>
          <i data-lucide="arrow-right"></i>
        </button>

        <p id="errorMsg" class="form-error" role="alert" aria-live="polite" hidden>
          <i data-lucide="alert-circle" aria-hidden="true"></i>
          <span></span>
        </p>
      </form>

      <p class="signup-link">Don’t have an account? <a href="#" aria-disabled="true" tabindex="-1">Sign Up</a></p>
    </section>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
