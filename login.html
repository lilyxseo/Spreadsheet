<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Mini WMS</title>
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <main class="login-page">
    <form class="login-card" id="loginForm" novalidate>
      <header class="login-header">
        <div class="app-mark" aria-hidden="true">W</div>
        <h1>Sign In</h1>
        <p>Akses dashboard WMS Anda.</p>
      </header>

      <div class="form-field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">@</span>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">•</span>
          <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Masukkan password" />
          <button class="toggle-pass" id="togglePassword" type="button" aria-label="Tampilkan password">Show</button>
        </div>
      </div>

      <button class="submit-btn" id="loginBtn" type="submit">Sign In</button>

      <p class="error-msg" id="errorMsg" role="alert" aria-live="polite"></p>

      <p class="signup-note">
        Don't have an account?
        <a href="#" aria-disabled="true" onclick="return false;">Sign Up</a>
      </p>
    </form>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
