<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Dashboard</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --line: #dbe5f5;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1e3a8a;
      --primary-2: #2563eb;
      --soft: #eaf1ff;
      --success: #16a34a;
      --danger: #dc2626;
      --radius: 16px;
      --shadow: 0 10px 28px rgba(30, 58, 138, 0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
    .app { min-height: 100vh; display: grid; grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .content { padding: 14px 14px 84px; }
    .header { position: sticky; top: 0; z-index: 20; background: rgba(243, 246, 251, 0.95); backdrop-filter: blur(6px); padding: 10px 0; }
    .header-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .title { font-size: 18px; font-weight: 800; color: var(--primary); }
    .pill { font-size: 12px; background: var(--soft); color: var(--primary); border-radius: 999px; padding: 6px 10px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-top: 12px; }
    .hidden { display: none !important; }
    .page-title { margin: 0 0 10px; font-size: 18px; }
    .search-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="text"] { flex: 1; min-width: 220px; border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-size: 16px; }
    button { border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer; font-weight: 700; }
    .btn-primary { background: var(--primary-2); color: #fff; }
    .btn-secondary { background: var(--primary); color: #fff; }
    .btn-ghost { background: #fff; border: 1px solid var(--line); color: var(--primary); }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--primary); padding: 7px 11px; font-size: 12px; }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
    .metric { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: #f8fbff; }
    .metric .k { font-size: 12px; color: var(--muted); }
    .metric .v { font-size: 24px; font-weight: 800; margin-top: 4px; }
    .status { margin-top: 8px; color: var(--muted); font-size: 13px; }
    .state { border: 1px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--muted); }
    .state.error { border-color: #fecaca; background: #fff7f7; color: var(--danger); }
    .result-list { display: grid; gap: 10px; }
    .result-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; }
    .result-head { display: flex; justify-content: space-between; gap: 8px; }
    .badge { border-radius: 999px; font-size: 11px; background: var(--soft); color: var(--primary); padding: 4px 8px; }
    .detail-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center; }
    .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; min-width: 680px; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #ebf0fa; white-space: nowrap; font-size: 13px; text-align: left; }
    th { background: #f3f7ff; color: var(--primary); }
    .chart { display: grid; gap: 8px; }
    .bar { display: grid; gap: 4px; }
    .bar-fill { height: 12px; border-radius: 999px; background: linear-gradient(90deg, #1e3a8a, #3b82f6); }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; padding: 8px; background: #fff; border-top: 1px solid var(--line); }
    .nav-btn { border: 1px solid var(--line); background: #fff; color: var(--primary); font-size: 11px; padding: 8px 6px; border-radius: 10px; }
    .nav-btn.active { background: var(--primary); color: #fff; }
    mark { background: #fde68a; border-radius: 3px; }

    @media (min-width: 768px) {
      .app { grid-template-columns: 250px 1fr; }
      .sidebar { display: block; background: #0f2f77; color: #fff; padding: 18px; position: sticky; top: 0; height: 100vh; }
      .side-link { display: block; width: 100%; margin-top: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; text-align: left; }
      .side-link.active { background: #2563eb; }
      .bottom-nav { display: none; }
      .content { padding: 18px; }
      .grid.dashboard { grid-template-columns: repeat(4, 1fr); }
      .grid.stats { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h2>Inventory Dashboard</h2>
    <div class="pill" id="lastSync">Belum sinkron</div>
    <div style="margin-top: 16px;"> 
      <button class="side-link active" data-page="dashboard">Dashboard</button>
      <button class="side-link" data-page="search">Cari Data</button>
      <button class="side-link" data-page="detail">Detail SKU</button>
      <button class="side-link" data-page="stats">Statistik</button>
      <button class="side-link" data-page="settings">Settings</button>
    </div>
  </aside>

  <main class="content">
    <div class="header"><div class="header-card"><div class="title">Inventory Multi-Page Dashboard</div><div class="pill" id="apiStatus">API: Memuat...</div></div></div>

    <section id="page-dashboard" class="panel page">
      <h3 class="page-title">Dashboard</h3>
      <div id="dashboardCards" class="grid dashboard"></div>
    </section>

    <section id="page-search" class="panel page hidden">
      <h3 class="page-title">Cari Data</h3>
      <div class="search-bar">
        <input id="searchInput" type="text" placeholder="Cari SKU / 4 digit SKU / nama barang" />
        <button class="btn-primary" onclick="runSearch()">Cari</button>
      </div>
      <div id="filterRow" class="filter-row"></div>
      <div id="status" class="status"></div>
      <div id="results" style="margin-top:10px;"></div>
    </section>

    <section id="page-detail" class="panel page hidden">
      <h3 class="page-title">Detail SKU</h3>
      <div id="detail"></div>
    </section>

    <section id="page-stats" class="panel page hidden">
      <h3 class="page-title">Statistik</h3>
      <div id="statsCards" class="grid stats"></div>
      <div id="statsChart" class="panel" style="margin-top:12px;"></div>
    </section>

    <section id="page-settings" class="panel page hidden">
      <h3 class="page-title">Settings / Info</h3>
      <p><strong>Status API:</strong> <span id="settingsApiState">-</span></p>
      <p><strong>Sheet digunakan:</strong> <span id="sheetInfo"></span></p>
      <p><strong>Auto Refresh:</strong> 60 detik</p>
      <button class="btn-secondary" onclick="loadAllData(true)">Refresh Manual</button>
    </section>
  </main>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-page="dashboard">Dashboard</button>
  <button class="nav-btn" data-page="search">Cari</button>
  <button class="nav-btn" data-page="detail">Detail</button>
  <button class="nav-btn" data-page="stats">Statistik</button>
  <button class="nav-btn" data-page="settings">Settings</button>
</nav>

<script>
const API_KEY = "AIzaSyAhRpt5u-xx1ysTq_u4xOOziVHmlBJb34E";
const SPREADSHEET_ID = "1KzOcV1V4bcxfsLzhfwXxnIxxZoTRlKh4UYhNizREpCM";
const SHEETS = ["Kartu Stock", "RPL", "BULKY", "Barang Masuk", "Barang Keluar"];
const FILTERS = ["Semua", ...SHEETS];
const DATA = {};
let currentFilter = "Semua", lastResults = [], lastQuery = "", apiConnected = false;

window.addEventListener("DOMContentLoaded", () => {
  bindNav(); bindEvents(); renderFilters(); initDashboard();
  document.getElementById("sheetInfo").textContent = SHEETS.join(", ");
  renderState("results", "Ketik keyword untuk mulai pencarian.");
  renderState("detail", "Pilih SKU dari halaman Cari Data.");
  loadAllData();
  setInterval(() => loadAllData(false, true), 60000);
});

function bindNav(){
  document.querySelectorAll("[data-page]").forEach(btn => btn.addEventListener("click", ()=>showPage(btn.dataset.page)));
}
function showPage(page){
  document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
  document.getElementById(`page-${page}`).classList.remove("hidden");
  document.querySelectorAll(".nav-btn,.side-link").forEach(b=>b.classList.toggle("active", b.dataset.page===page));
}
function bindEvents(){ document.getElementById("searchInput").addEventListener("keydown", e => e.key==="Enter" && runSearch()); }

async function loadAllData(manual=false, silent=false) {
  if (!silent) setStatus("loading", manual ? "Refresh data..." : "Memuat data dari Google Sheets...");
  try {
    for (const sheet of SHEETS) DATA[sheet] = parseSheet(await fetchSheet(sheet));
    apiConnected = true; updateApiState(); updateSyncTime();
    setStatus("ok", "Data siap. Silakan cari SKU atau nama barang.");
    updateDashboard(); updateStats();
    if (lastQuery) runSearch();
  } catch (err) {
    apiConnected = false; updateApiState();
    setStatus("error", "Gagal memuat data: " + err.message);
    renderError("results", "Tidak bisa memuat data. Cek API Key / Spreadsheet ID.");
  }
}

async function fetchSheet(sheetName) {
  const range = `${sheetName}!A1:ZZ10000`;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;
  const res = await fetch(url); const json = await res.json();
  if (!res.ok || json.error) throw new Error(`${sheetName}: ${(json.error && json.error.message) || res.statusText}`);
  return json.values || [];
}
function parseSheet(values){ if(!Array.isArray(values)||!values.length) return []; const h=detectHeaderIndex(values); if(h<0) return []; const headers=values[h].map((v,i)=>normalizeHeader(v)||`col_${i+1}`); const rows=[]; for(let r=h+1;r<values.length;r++){const row=values[r]||[]; if(!row.length||row.every(c=>!String(c||"").trim())) continue; const obj={}; headers.forEach((k,i)=>obj[k]=row[i]||""); rows.push(obj);} return rows; }
function detectHeaderIndex(values){ const req=["sku","nama","from","to","qty"]; let bi=-1,bs=0; for(let i=0;i<Math.min(values.length,25);i++){ const t=(values[i]||[]).map(clean).join("|"); let s=0; req.forEach(k=>t.includes(k)&&s++); if(s>bs){bs=s;bi=i;} } return bs>=1?bi:-1; }

function runSearch(){
  const qRaw = document.getElementById("searchInput").value || ""; const q = clean(qRaw); lastQuery = qRaw;
  if(!q){ lastResults=[]; renderState("results","Masukkan kata kunci pencarian."); renderState("detail","Pilih salah satu SKU untuk lihat detail."); return; }
  const words = q.split(" ").filter(Boolean), bySku = new Map();
  for(const sheet of SHEETS){ if(currentFilter!=="Semua"&&currentFilter!==sheet) continue;
    for(const row of DATA[sheet]||[]){ const sku=getVal(row,["sku"]), name=getVal(row,["nama barang","nama","item","description"]); if(!sku&&!name) continue;
      const skuNorm=clean(sku), nameNorm=clean(name), combined=`${skuNorm} ${nameNorm}`;
      const match = skuNorm===q || skuNorm.includes(q) || (q.length===4&&skuNorm.endsWith(q)) || nameNorm.includes(q) || words.every(w=>combined.includes(w));
      if(!match) continue; const key=skuNorm||nameNorm; if(!bySku.has(key)) bySku.set(key,{sku,nama:name,sources:new Set(),rows:[]}); const it=bySku.get(key); it.sources.add(sheet); it.rows.push({sheet,row});
    }
  }
  lastResults = Array.from(bySku.values()).map(v=>({...v,sources:[...v.sources]}));
  renderResults(lastResults,qRaw); if(lastResults.length===1) showDetail(lastResults[0].sku||lastResults[0].nama);
}
function renderResults(results, query){ const el=document.getElementById("results"); if(!results.length) return renderState("results","Data tidak ditemukan."); el.innerHTML=`<div class='status'>${results.length} hasil ditemukan.</div><div class='result-list'>`+results.map(r=>`<div class='result-card' onclick="showDetail('${escAttr(r.sku||r.nama)}');showPage('detail')"><div class='result-head'><strong>${highlight(r.nama||"(Tanpa Nama)",query)}</strong><div>${r.sources.map(s=>`<span class='badge'>${esc(s)}</span>`).join(" ")}</div></div><div>SKU: ${highlight(r.sku||"-",query)}</div></div>`).join("")+"</div>"; }

function showDetail(identifier){ const key=clean(identifier); const sel=lastResults.find(r=>clean(r.sku)===key||clean(r.nama)===key); if(!sel) return renderState("detail","Detail tidak tersedia."); const sku=sel.sku||"-", nama=sel.nama||"-"; let html=`<div class='detail-head'><div><div><strong>SKU:</strong> ${esc(sku)}</div><div><strong>Nama:</strong> ${esc(nama)}</div></div><button class='btn-ghost' onclick="copySku('${escAttr(sku)}')">Copy SKU</button></div>`; SHEETS.forEach(sheet=>{const rows=(DATA[sheet]||[]).filter(r=>clean(getVal(r,["sku"]))===clean(sku)); html+=`<h4>${sheet}</h4>${renderTable(rows)}`;}); document.getElementById("detail").innerHTML=html; }
function renderTable(rows){ if(!rows.length) return `<div class='state'>Tidak ada data.</div>`; const headers=Object.keys(rows[0]); let h=`<div class='table-scroll'><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>`; rows.forEach(r=>h+=`<tr>${headers.map(k=>`<td>${esc(r[k])}</td>`).join("")}</tr>`); return h+"</tbody></table></div>"; }

function updateDashboard(){
  const skuSet=new Set(); let totals={"Kartu Stock":0,"RPL":0,"BULKY":0,"Barang Masuk":0,"Barang Keluar":0};
  SHEETS.forEach(s=>{(DATA[s]||[]).forEach(r=>{totals[s]++; const sku=getVal(r,["sku"]); if(sku) skuSet.add(clean(sku));});});
  const cards=[
    ["Total SKU",skuSet.size],["Total Kartu Stock",totals["Kartu Stock"]],["Total RPL",totals["RPL"]],["Total BULKY",totals["BULKY"]],["Total Barang Masuk",totals["Barang Masuk"]],["Total Barang Keluar",totals["Barang Keluar"]],["Last Refresh",new Date().toLocaleTimeString("id-ID")]
  ];
  document.getElementById("dashboardCards").innerHTML=cards.map(c=>`<div class='metric'><div class='k'>${c[0]}</div><div class='v'>${c[1]}</div></div>`).join("");
}

function updateStats(){
  let totalIn=0,totalOut=0; const inSku={},outSku={},loc=new Set();
  (DATA["Barang Masuk"]||[]).forEach(r=>{const sku=getVal(r,["sku"])||"-"; const q=parseNumber(getVal(r,["qty","jumlah","pcs"])); totalIn+=q; inSku[sku]=(inSku[sku]||0)+q; ["from","to","lokasi","location"].forEach(k=>getVal(r,[k])&&loc.add(clean(getVal(r,[k]))));});
  (DATA["Barang Keluar"]||[]).forEach(r=>{const sku=getVal(r,["sku"])||"-"; const q=parseNumber(getVal(r,["qty","jumlah","pcs"])); totalOut+=q; outSku[sku]=(outSku[sku]||0)+q; ["from","to","lokasi","location"].forEach(k=>getVal(r,[k])&&loc.add(clean(getVal(r,[k]))));});
  const topIn = Object.entries(inSku).sort((a,b)=>b[1]-a[1])[0]||["-",0];
  const topOut = Object.entries(outSku).sort((a,b)=>b[1]-a[1])[0]||["-",0];
  document.getElementById("statsCards").innerHTML = [
    ["Total Barang Masuk",totalIn],["Total Barang Keluar",totalOut],["Top SKU Masuk",`${topIn[0]} (${topIn[1]})`],["Top SKU Keluar",`${topOut[0]} (${topOut[1]})`],["Lokasi Unik",loc.size]
  ].map(c=>`<div class='metric'><div class='k'>${esc(c[0])}</div><div class='v'>${esc(c[1])}</div></div>`).join("");
  const max = Math.max(totalIn,totalOut,1);
  document.getElementById("statsChart").innerHTML = `<h4>Simple Chart</h4><div class='chart'>
    <div class='bar'><small>Barang Masuk (${totalIn})</small><div class='bar-fill' style='width:${(totalIn/max)*100}%'></div></div>
    <div class='bar'><small>Barang Keluar (${totalOut})</small><div class='bar-fill' style='width:${(totalOut/max)*100}%'></div></div>
  </div>`;
}

function initDashboard(){ document.getElementById("dashboardCards").innerHTML = "<div class='state'>Loading...</div>"; }
function renderFilters(){ document.getElementById("filterRow").innerHTML = FILTERS.map(f=>`<button class='chip ${f===currentFilter?"active":""}' onclick="setFilter('${escAttr(f)}')">${esc(f)}</button>`).join(""); }
function setFilter(f){ currentFilter=f; renderFilters(); runSearch(); }
function setStatus(type,text){ const el=document.getElementById("status"); el.textContent = type==="loading"?`⏳ ${text}`:(type==="error"?`❌ ${text}`:`✅ ${text}`); }
function renderState(id,text){ document.getElementById(id).innerHTML=`<div class='state'>${esc(text)}</div>`; }
function renderError(id,text){ document.getElementById(id).innerHTML=`<div class='state error'>${esc(text)}</div>`; }
function updateSyncTime(){ document.getElementById("lastSync").textContent = "Sync: "+new Date().toLocaleTimeString("id-ID"); }
function updateApiState(){ const t = apiConnected?"Terhubung":"Tidak terhubung"; document.getElementById("apiStatus").textContent=`API: ${t}`; document.getElementById("settingsApiState").textContent=t; }
function copySku(sku){ navigator.clipboard.writeText(sku||"").then(()=>setStatus("ok",`SKU ${sku} berhasil disalin.`)); }

function getVal(row, keys){ const cols=Object.keys(row||{}); for(const key of keys){ const f=cols.find(c=>clean(c).includes(clean(key))); if(f&&row[f]!=null) return String(row[f]); } return ""; }
function highlight(text, query){ const raw=String(text||""); const q=String(query||"").trim(); if(!q) return esc(raw); const e=q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); return esc(raw).replace(new RegExp(`(${e})`,"ig"),"<mark>$1</mark>"); }
function normalizeHeader(v){ return clean(v).replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim(); }
function clean(v){ return String(v||"").toLowerCase().trim().replace(/[_-]+/g," ").replace(/\s+/g," "); }
function parseNumber(v){ const n=parseFloat(String(v||"").replace(/[^0-9.-]/g,"")); return Number.isFinite(n)?n:0; }
function esc(v){ return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m])); }
function escAttr(v){ return String(v??"").replace(/'/g,"\\'"); }
</script>
</body>
</html>
