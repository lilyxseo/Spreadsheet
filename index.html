<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Multi-Page Dashboard</title>
  <style>
    :root {
      --bg: #f3f6fc;
      --panel: #ffffff;
      --line: #d8e2f3;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1d4ed8;
      --primary-dark: #0b2f88;
      --primary-soft: #dbeafe;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --radius: 16px;
      --shadow: 0 8px 24px rgba(13, 42, 103, 0.08);
      --header-h: 64px;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
    .app { min-height: 100vh; }

    .top-header {
      position: sticky; top: 0; z-index: 20; height: var(--header-h);
      background: #fff; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
    }
    .title-wrap h1 { margin: 0; font-size: 18px; color: var(--primary-dark); }
    .title-wrap p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    .status-chip { border-radius: 999px; padding: 6px 10px; font-size: 12px; border: 1px solid var(--line); background: #fff; }

    .layout { display: grid; grid-template-columns: 1fr; }
    .sidebar { display: none; }

    .content { padding: 14px 14px 90px; }
    .page { display: none; }
    .page.active { display: block; }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    .panel h3 { margin: 16px 0 10px; font-size: 15px; color: #1e3a8a; }

    .summary-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .metric { background: #f8fbff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    .metric .k { color: var(--muted); font-size: 12px; }
    .metric .v { font-size: 24px; font-weight: 800; margin-top: 4px; color: var(--primary-dark); }

    .search-input { width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; font-size: 16px; }
    .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,78,216,.12); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button { border: 0; border-radius: 12px; padding: 10px 12px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #1e40af; color: #fff; }
    .btn-ghost { background: #fff; border: 1px solid var(--line); color: var(--primary); }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .chip { border-radius: 999px; border: 1px solid var(--line); padding: 7px 11px; background: #fff; font-size: 12px; color: #1e3a8a; }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .list { display: grid; gap: 10px; }
    .result-card { border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 10px; cursor: pointer; }
    .result-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
    .badge { background: var(--primary-soft); border-radius: 999px; font-size: 11px; color: #1d4ed8; padding: 4px 8px; }

    .state { border: 1px dashed var(--line); border-radius: 12px; background: #fafcff; color: var(--muted); text-align: center; padding: 14px; }
    .state.error { border-color: #fecaca; background: #fff5f5; color: var(--danger); }

    .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; min-width: 680px; border-collapse: collapse; }
    th, td { padding: 8px 10px; white-space: nowrap; border-bottom: 1px solid #ecf1f8; text-align: left; font-size: 13px; }
    th { background: #f4f8ff; color: #1e3a8a; }

    .chart { display: grid; gap: 8px; }
    .bar-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: center; }
    .bar-track { background: #e8efff; border-radius: 999px; height: 10px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #1d4ed8, #60a5fa); }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: #fff; border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(5,1fr);
    }
    .nav-btn { border: 0; background: transparent; padding: 10px 6px; font-size: 12px; color: #334155; }
    .nav-btn.active { color: var(--primary); font-weight: 700; }

    mark { background: #fde68a; padding: 0 2px; border-radius: 3px; }

    @media (min-width: 768px) {
      .layout { grid-template-columns: 240px 1fr; }
      .sidebar {
        display: block; position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h));
        background: #0b2f88; color: #fff; padding: 16px;
      }
      .side-brand { font-size: 18px; font-weight: 800; }
      .side-sub { font-size: 12px; opacity: .9; margin-bottom: 14px; }
      .side-menu { display: grid; gap: 6px; }
      .side-btn { text-align: left; border: 1px solid rgba(255,255,255,.2); background: transparent; color: #fff; padding: 10px; border-radius: 10px; }
      .side-btn.active { background: rgba(255,255,255,.2); }
      .content { padding: 16px 18px; }
      .summary-grid { grid-template-columns: repeat(2,1fr); }
      .bottom-nav { display: none; }
    }

    @media (min-width: 1100px) {
      .summary-grid { grid-template-columns: repeat(4,1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-header">
      <div class="title-wrap">
        <h1>Inventory Dashboard</h1>
        <p id="statusText">Memuat data dari Google Sheets...</p>
      </div>
      <div class="status-chip" id="lastSync">Belum sinkron</div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="side-brand">Menu Dashboard</div>
        <div class="side-sub">Auto refresh 60 detik</div>
        <div class="side-menu" id="sideMenu"></div>
      </aside>

      <main class="content">
        <section class="page active" id="page-dashboard">
          <div class="panel">
            <h2>Dashboard</h2>
            <div class="summary-grid" id="dashboardSummary"></div>
          </div>
        </section>

        <section class="page" id="page-search">
          <div class="panel">
            <h2>Cari Data</h2>
            <input id="searchInput" class="search-input" type="text" placeholder="Cari SKU / 4 digit SKU / nama barang" />
            <div class="btn-row">
              <button class="btn-primary" onclick="runSearch()">Cari</button>
              <button class="btn-secondary" onclick="loadAllData(true)">Refresh</button>
            </div>
            <div class="chips" id="filterRow"></div>
          </div>
          <div class="panel"><h2>Hasil Pencarian</h2><div id="results"></div></div>
        </section>

        <section class="page" id="page-detail">
          <div class="panel"><h2>Detail SKU</h2><div id="detail"></div></div>
        </section>

        <section class="page" id="page-stats">
          <div class="panel"><h2>Statistik</h2><div class="summary-grid" id="statsSummary"></div><h3>Top SKU Masuk</h3><div id="topInChart" class="chart"></div><h3>Top SKU Keluar</h3><div id="topOutChart" class="chart"></div></div>
        </section>

        <section class="page" id="page-settings">
          <div class="panel">
            <h2>Settings / Info</h2>
            <div id="apiState" class="state">Mengecek status API...</div>
            <div class="btn-row"><button class="btn-primary" onclick="loadAllData(true)">Refresh Manual</button></div>
            <h3>Informasi Sheet</h3>
            <div class="chips" id="sheetInfo"></div>
          </div>
        </section>
      </main>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

<script>
const API_KEY = "AIzaSyAhRpt5u-xx1ysTq_u4xOOziVHmlBJb34E";
const SPREADSHEET_ID = "1KzOcV1V4bcxfsLzhfwXxnIxxZoTRlKh4UYhNizREpCM";
const SHEETS = ["Kartu Stock", "RPL", "BULKY", "Barang Masuk", "Barang Keluar"];
const FILTERS = ["Semua", ...SHEETS];
const PAGES = [
  {id:"dashboard",label:"Dashboard"},{id:"search",label:"Cari"},{id:"detail",label:"Detail"},{id:"stats",label:"Statistik"},{id:"settings",label:"Settings"}
];
const DATA = {};
let currentFilter = "Semua", currentPage = "dashboard", lastResults = [], lastQuery = "", apiOk = false;

window.addEventListener("DOMContentLoaded", () => {
  renderNav(); renderFilters(); renderSheetInfo(); bindEvents(); initSummary();
  loadAllData(); setInterval(() => loadAllData(false, true), 60000);
});

function bindEvents(){ document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter") runSearch();}); }
function renderNav(){
  const nav = PAGES.map(p=>`<button class="nav-btn ${p.id===currentPage?"active":""}" onclick="goPage('${p.id}')">${p.label}</button>`).join("");
  document.getElementById("bottomNav").innerHTML = nav;
  document.getElementById("sideMenu").innerHTML = PAGES.map(p=>`<button class="side-btn ${p.id===currentPage?"active":""}" onclick="goPage('${p.id}')">${p.label}</button>`).join("");
}
function goPage(id){ currentPage=id; document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById('page-'+id).classList.add('active'); renderNav(); }

async function loadAllData(manual=false, silent=false){
  if(!silent) setStatus("loading", manual?"Refresh data...":"Memuat data dari Google Sheets...");
  try {
    for (const sheet of SHEETS){ DATA[sheet] = parseSheet(await fetchSheet(sheet)); }
    apiOk = true; setStatus("ok","Data siap digunakan."); updateSyncTime(); updateDashboard(); updateStats();
    if(lastQuery) runSearch(); else { renderState("results","Ketik keyword untuk mulai pencarian."); renderState("detail","Pilih hasil dari menu Cari Data."); }
  } catch(err){ apiOk = false; setStatus("error","Gagal memuat data: " + err.message); renderError("results","Tidak bisa memuat data. Cek API Key / Spreadsheet ID."); }
  updateApiState();
}
async function fetchSheet(sheetName){ const range = `${sheetName}!A1:ZZ10000`; const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`; const res=await fetch(url); const json=await res.json(); if(!res.ok||json.error) throw new Error(`${sheetName}: ${(json.error&&json.error.message)||res.statusText}`); return json.values||[]; }
function parseSheet(values){ if(!Array.isArray(values)||!values.length) return []; const h=detectHeaderIndex(values); if(h<0) return []; const headers=values[h].map((v,i)=>normalizeHeader(v)||`col_${i+1}`); const rows=[]; for(let r=h+1;r<values.length;r++){ const row=values[r]||[]; if(!row.length||row.every(c=>!String(c||"").trim())) continue; const obj={}; headers.forEach((k,i)=>obj[k]=row[i]||""); rows.push(obj);} return rows; }
function detectHeaderIndex(values){ const req=["sku","nama","from","to","qty"]; let b=-1,s=0; for(let i=0;i<Math.min(values.length,25);i++){ const txt=(values[i]||[]).map(c=>clean(c)).join("|"); let v=0; req.forEach(k=>{if(txt.includes(k)) v++;}); if(v>s){s=v;b=i;} } return s>=1?b:-1; }

function runSearch(){
  const qRaw=document.getElementById("searchInput").value||""; const q=clean(qRaw); lastQuery=qRaw;
  if(!q){ lastResults=[]; renderState("results","Masukkan kata kunci pencarian."); renderState("detail","Pilih salah satu SKU untuk lihat detail."); return; }
  const words=q.split(" ").filter(Boolean), bySku=new Map();
  for(const sheet of SHEETS){ if(currentFilter!=="Semua"&&currentFilter!==sheet) continue; for(const row of DATA[sheet]||[]){ const sku=getVal(row,["sku"]),name=getVal(row,["nama barang","nama","item","description"]); if(!sku&&!name) continue; const skuN=clean(sku),nameN=clean(name),comb=`${skuN} ${nameN}`; const match=skuN===q||skuN.includes(q)||(q.length===4&&skuN.endsWith(q))||nameN.includes(q)||words.every(w=>comb.includes(w)); if(!match) continue; const key=skuN||nameN; if(!bySku.has(key)) bySku.set(key,{sku,nama:name,sources:new Set(),rows:[]}); const item=bySku.get(key); item.sources.add(sheet); item.rows.push({sheet,row}); }}
  lastResults=Array.from(bySku.values()).map(v=>({...v,sources:[...v.sources]}));
  renderResults(lastResults,qRaw); if(lastResults.length===1){ showDetail(lastResults[0].sku||lastResults[0].nama); goPage('detail'); }
}

function renderResults(results,query){ const el=document.getElementById("results"); if(!results.length) return renderState("results","Data tidak ditemukan."); el.innerHTML=`<div class="list">${results.map(r=>`<div class="result-card" onclick="showDetail('${escAttr(r.sku||r.nama)}');goPage('detail')"><div class="result-head"><strong>${highlight(r.nama||"(Tanpa Nama)",query)}</strong><div>${r.sources.map(s=>`<span class='badge'>${esc(s)}</span>`).join(" ")}</div></div><div>SKU: ${highlight(r.sku||"-",query)}</div></div>`).join("")}</div>`; }

function showDetail(identifier){ const key=clean(identifier); const selected=lastResults.find(r=>clean(r.sku)===key||clean(r.nama)===key); if(!selected) return renderState("detail","Detail tidak tersedia."); const sku=selected.sku||"-", nama=selected.nama||"-"; let html=`<div class='btn-row'><button class='btn-ghost' onclick="copySku('${escAttr(sku)}')">Copy SKU</button></div><p><strong>SKU:</strong> ${esc(sku)}<br><strong>Nama Barang:</strong> ${esc(nama)}</p>`; SHEETS.forEach(s=>{ const rows=(DATA[s]||[]).filter(r=>clean(getVal(r,["sku"]))===clean(sku)); html+=`<h3>${s}</h3>${renderTable(rows)}`; }); document.getElementById("detail").innerHTML=html; }
function renderTable(rows){ if(!rows.length) return `<div class='state'>Tidak ada data.</div>`; const headers=Object.keys(rows[0]); let h="<div class='table-scroll'><table><thead><tr>"; headers.forEach(c=>h+=`<th>${esc(c)}</th>`); h+="</tr></thead><tbody>"; rows.forEach(r=>{ h+="<tr>"; headers.forEach(c=>h+=`<td>${esc(r[c])}</td>`); h+="</tr>"; }); return h+="</tbody></table></div>"; }

function updateDashboard(){
  const skuSet = new Set(); SHEETS.forEach(s=>(DATA[s]||[]).forEach(r=>{ const sku=getVal(r,["sku"]); if(sku) skuSet.add(clean(sku)); }));
  const cards=[
    ["Total SKU",skuSet.size],["Total data Kartu Stock",(DATA["Kartu Stock"]||[]).length],["Total data RPL",(DATA["RPL"]||[]).length],["Total data BULKY",(DATA["BULKY"]||[]).length],
    ["Total Barang Masuk",sumQty("Barang Masuk")],["Total Barang Keluar",sumQty("Barang Keluar")],["Last Refresh",new Date().toLocaleTimeString("id-ID")]
  ];
  document.getElementById("dashboardSummary").innerHTML = cards.map(c=>`<div class='metric'><div class='k'>${c[0]}</div><div class='v'>${esc(c[1])}</div></div>`).join("");
}
function updateStats(){
  const totalIn=sumQty("Barang Masuk"), totalOut=sumQty("Barang Keluar"); const inMap=countSku("Barang Masuk"), outMap=countSku("Barang Keluar");
  const locSet=new Set(); SHEETS.forEach(s=>(DATA[s]||[]).forEach(r=>["from","to","lokasi","location"].forEach(k=>{const v=getVal(r,[k]); if(v) locSet.add(clean(v)); })));
  document.getElementById("statsSummary").innerHTML = [["Total barang masuk",totalIn],["Total barang keluar",totalOut],["Jumlah lokasi unik",locSet.size]].map(c=>`<div class='metric'><div class='k'>${c[0]}</div><div class='v'>${c[1]}</div></div>`).join("");
  renderBarChart("topInChart", topN(inMap,5)); renderBarChart("topOutChart", topN(outMap,5));
}
function renderBarChart(id,rows){ if(!rows.length) return renderState(id,"Belum ada data."); const max=rows[0][1]||1; document.getElementById(id).innerHTML=rows.map(([sku,val])=>`<div class='bar-row'><div>${esc(sku||"-")}</div><div class='bar-track'><div class='bar-fill' style='width:${Math.max(4,Math.round(val/max*100))}%'></div></div><div>${val}</div></div>`).join(""); }

function sumQty(sheet){ return (DATA[sheet]||[]).reduce((a,r)=>a+parseNumber(getVal(r,["qty","jumlah","pcs"])),0); }
function countSku(sheet){ const m=new Map(); (DATA[sheet]||[]).forEach(r=>{ const sku=getVal(r,["sku"])||"(No SKU)"; m.set(sku,(m.get(sku)||0)+parseNumber(getVal(r,["qty","jumlah","pcs"]))); }); return m; }
function topN(map,n){ return [...map.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n); }

function initSummary(){ document.getElementById("dashboardSummary").innerHTML=`<div class='state'>Loading summary...</div>`; document.getElementById("statsSummary").innerHTML=`<div class='state'>Loading statistik...</div>`; renderState("results","Loading data..."), renderState("detail","Loading data..."); }
function renderFilters(){ document.getElementById("filterRow").innerHTML = FILTERS.map(f=>`<button class='chip ${f===currentFilter?"active":""}' onclick="setFilter('${escAttr(f)}')">${esc(f)}</button>`).join(""); }
function setFilter(f){ currentFilter=f; renderFilters(); runSearch(); }
function renderSheetInfo(){ document.getElementById("sheetInfo").innerHTML = SHEETS.map(s=>`<span class='badge'>${esc(s)}</span>`).join(" "); }

function setStatus(type,text){ document.getElementById("statusText").textContent=(type==="loading"?"⏳ ":type==="error"?"❌ ":"✅ ")+text; }
function updateSyncTime(){ document.getElementById("lastSync").textContent="Sync: "+new Date().toLocaleTimeString("id-ID"); }
function updateApiState(){ document.getElementById("apiState").className = apiOk ? "state" : "state error"; document.getElementById("apiState").textContent = apiOk ? "Koneksi API: Terhubung" : "Koneksi API: Gagal"; }
function renderState(id,text){ document.getElementById(id).innerHTML=`<div class='state'>${esc(text)}</div>`; }
function renderError(id,text){ document.getElementById(id).innerHTML=`<div class='state error'>${esc(text)}</div>`; }
function copySku(sku){ navigator.clipboard.writeText(sku||"").then(()=>setStatus("ok",`SKU ${sku} berhasil disalin.`)); }

function getVal(row,keys){ const cols=Object.keys(row||{}); for(const key of keys){ const f=cols.find(c=>clean(c).includes(clean(key))); if(f&&row[f]!=null) return String(row[f]); } return ""; }
function highlight(text, query){ const raw=String(text||""); const q=String(query||"").trim(); if(!q) return esc(raw); const escaped=q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); return esc(raw).replace(new RegExp(`(${escaped})`,"ig"),"<mark>$1</mark>"); }
function normalizeHeader(v){ return clean(v).replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim(); }
function clean(v){ return String(v||"").toLowerCase().trim().replace(/[_-]+/g," ").replace(/\s+/g," "); }
function parseNumber(v){ const n=parseFloat(String(v||"").replace(/[^0-9.-]/g,"")); return Number.isFinite(n)?n:0; }
function esc(v){ return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m])); }
function escAttr(v){ return String(v??"").replace(/'/g,"\\'"); }
</script>
</body>
</html>
