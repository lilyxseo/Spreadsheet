<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Dashboard SPA</title>
  <style>
    :root {--bg:#f3f6fb;--panel:#ffffff;--panel-soft:#f8fbff;--line:#dbe5f5;--text:#0f172a;--muted:#64748b;--primary:#1e3a8a;--primary-2:#2563eb;--success:#059669;--danger:#dc2626;--warning:#ea580c;--radius:16px;--shadow:0 10px 28px rgba(30,58,138,.08)}
    body.dark {--bg:#0b1222;--panel:#101a31;--panel-soft:#0e1a34;--line:#243452;--text:#e2e8f0;--muted:#94a3b8;--primary:#60a5fa;--primary-2:#3b82f6;--shadow:0 10px 28px rgba(5,10,22,.45)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    body.compact .panel{padding:10px} body.compact .metric{padding:10px}
    .app{display:grid;grid-template-columns:1fr;min-height:100vh}.sidebar{display:none}.content{padding:12px 12px 84px}
    .header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);padding:8px 0}
    .header-card{display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:var(--radius);box-shadow:var(--shadow)}
    .title{font-size:18px;font-weight:800;color:var(--primary)}.subtitle{font-size:12px;color:var(--muted)}
    .pill{font-size:12px;border-radius:999px;padding:6px 10px;background:var(--panel-soft);border:1px solid var(--line)}
    .panel{margin-top:12px;background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:var(--radius);box-shadow:var(--shadow)}
    .page-title{margin:0 0 10px;font-size:18px}.grid{display:grid;gap:10px;grid-template-columns:1fr}
    .metric{background:var(--panel-soft);border:1px solid var(--line);border-radius:14px;padding:12px}.metric .k{font-size:12px;color:var(--muted)}.metric .v{font-size:22px;font-weight:800;margin-top:4px}
    .search-lg{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);font-size:16px;background:var(--panel)}
    .search-bar,.toolbar,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} button,select{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);color:var(--text);font-weight:700;cursor:pointer}
    .btn-primary{background:var(--primary-2);color:#fff;border-color:transparent}.btn-ghost{background:transparent}.chip{border-radius:999px;font-size:12px;padding:7px 11px}.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .state{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted)}.state.error{border-color:#fecaca;background:#fff7f7;color:var(--danger)}
    .result-list{display:grid;gap:10px}.result-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-soft)}.result-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .badge{border-radius:999px;padding:3px 8px;font-size:11px;color:#fff;display:inline-block}.b-kartu{background:#2563eb}.b-rpl{background:#16a34a}.b-bulky{background:#7c3aed}.b-in{background:#059669}.b-out{background:#ea580c}
    .bar-row{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center;margin:6px 0}.bar-fill{height:12px;border-radius:999px;background:linear-gradient(90deg,#1e3a8a,#3b82f6)}
    .timeline{display:grid;gap:8px}.tl-item{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel-soft)}
    .skeleton{height:66px;border-radius:12px;background:linear-gradient(90deg,#e7eefb 25%,#f1f6ff 37%,#e7eefb 63%);background-size:400% 100%;animation:sh 1.4s ease infinite}@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
    .toast{position:fixed;right:12px;bottom:90px;background:#111827;color:#fff;padding:10px 12px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;z-index:60}.toast.show{opacity:1;transform:translateY(0)}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px;background:var(--panel);border-top:1px solid var(--line);z-index:50}.nav-btn{font-size:11px;padding:8px 6px}.nav-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .page-shell{animation:fadeIn .18s ease}@keyframes fadeIn{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}} mark{background:#fde68a;border-radius:3px}
    .table-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:310px}.table-wrap table{min-width:680px;border-collapse:collapse;width:100%}.table-wrap th,.table-wrap td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;white-space:nowrap}.table-wrap th{position:sticky;top:0;background:var(--panel-soft)}
    @media (min-width:900px){.app{grid-template-columns:250px 1fr}.sidebar{display:block;background:#0f2f77;color:#fff;padding:16px;position:sticky;top:0;height:100vh}.side-link{display:block;width:100%;margin-top:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;text-align:left}.side-link.active{background:#2563eb}.bottom-nav{display:none}.content{padding:18px}.grid.dashboard{grid-template-columns:repeat(4,1fr)}.grid.stats{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h2>Inventory Dashboard</h2>
    <div class="pill" id="lastSync">Belum sinkron</div>
    <div style="margin-top:16px">
      <button class="side-link" data-route="/">Dashboard</button>
      <button class="side-link" data-route="/search">Cari Data</button>
      <button class="side-link" data-route="/statistics">Statistik</button>
      <button class="side-link" data-route="/movement">Movement</button>
      <button class="side-link" data-route="/settings">Settings</button>
    </div>
  </aside>
  <main class="content">
    <div class="header"><div class="header-card"><div><div class="title">Mini WMS Dashboard</div><div class="subtitle" id="connText">Memuat data...</div></div><div class="pill" id="apiStatus">API: Memuat...</div></div></div>
    <div id="appView" class="page-shell"></div>
  </main>
</div>
<nav class="bottom-nav">
  <button class="nav-btn" data-route="/">Dash</button><button class="nav-btn" data-route="/search">Cari</button><button class="nav-btn" data-route="/statistics">Stats</button><button class="nav-btn" data-route="/movement">Move</button><button class="nav-btn" data-route="/settings">Info</button><button class="nav-btn" data-route="/search">SKU</button>
</nav>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/navigo@8/dist/navigo.min.js"></script>
<script>
const API_KEY="AIzaSyAhRpt5u-xx1ysTq_u4xOOziVHmlBJb34E",SPREADSHEET_ID="1KzOcV1V4bcxfsLzhfwXxnIxxZoTRlKh4UYhNizREpCM";
const SHEETS=["Kartu Stock","RPL","BULKY","Barang Masuk","Barang Keluar"],FILTERS=["Semua",...SHEETS];
const App={state:{data:{},cacheSku:new Map(),isLoaded:false,isLoading:false,apiConnected:false,currentFilter:"Semua",lastResults:[],lastQuery:""},router:new Navigo("/"),el:{view:document.getElementById("appView")}};
const Api={async fetchSheet(sheetName){const range=`${sheetName}!A1:ZZ10000`;const url=`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;const res=await fetch(url);const json=await res.json();if(!res.ok||json.error)throw new Error(`${sheetName}: ${(json.error&&json.error.message)||res.statusText}`);return json.values||[];},async loadAllData(){for(const sheet of SHEETS)App.state.data[sheet]=Parser.parseSheet(await Api.fetchSheet(sheet));Parser.rebuildSkuCache();App.state.isLoaded=true;}};
const Parser={parseSheet(values){if(!Array.isArray(values)||!values.length)return[];const h=Parser.detectHeaderIndex(values);if(h<0)return[];const headers=values[h].map((v,i)=>Utils.normalizeHeader(v)||`col_${i+1}`);const rows=[];for(let r=h+1;r<values.length;r++){const row=values[r]||[];if(!row.length||row.every(c=>!String(c||"").trim()))continue;const obj={};headers.forEach((k,i)=>obj[k]=row[i]||"");rows.push(obj);}return rows;},detectHeaderIndex(values){const req=["sku","nama","nama barang","item","description","qty","tanggal","from","to","lokasi"];let bi=-1,bs=0;for(let i=0;i<Math.min(values.length,25);i++){const t=(values[i]||[]).map(Utils.clean).join("|");let s=0;req.forEach(k=>t.includes(Utils.clean(k))&&s++);if(s>bs){bs=s;bi=i;}}return bs>=1?bi:-1;},rebuildSkuCache(){App.state.cacheSku=new Map();for(const sheet of SHEETS){for(const row of App.state.data[sheet]||[]){const sku=Utils.getVal(row,["sku"]),nama=Utils.getVal(row,["nama barang","nama","item","description"]),key=Utils.clean(sku||nama);if(!key)continue;if(!App.state.cacheSku.has(key))App.state.cacheSku.set(key,{sku:sku||"-",nama:nama||"-",sources:new Set(),rows:[]});const it=App.state.cacheSku.get(key);it.sources.add(sheet);it.rows.push({sheet,row});}}}};
const Utils={clean:v=>String(v||"").toLowerCase().trim().replace(/[_-]+/g," ").replace(/\s+/g," "),esc:v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m])),parseNumber:v=>{const n=parseFloat(String(v||"").replace(/[^0-9.-]/g,""));return Number.isFinite(n)?n:0},normalizeHeader:v=>Utils.clean(v).replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim(),getVal(row,keys){const cols=Object.keys(row||{});for(const key of keys){const f=cols.find(c=>Utils.clean(c).includes(Utils.clean(key)));if(f&&row[f]!=null)return String(row[f]);}return ""},toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}};
const Render={layout(html){App.el.view.classList.remove("page-shell");void App.el.view.offsetWidth;App.el.view.classList.add("page-shell");App.el.view.innerHTML=html;},loading(){Render.layout(`<section class='panel'><h3 class='page-title'>Loading</h3><div class='skeleton'></div><div class='skeleton' style='margin-top:10px'></div></section>`);},notFound(){Render.layout(`<section class='panel'><h3 class='page-title'>404</h3><div class='state error'>Halaman tidak ditemukan.</div></section>`);},dashboard(){const totals={};SHEETS.forEach(s=>totals[s]=(App.state.data[s]||[]).length);Render.layout(`<section class='panel'><h3 class='page-title'>Dashboard</h3><input id='quickSearch' class='search-lg' placeholder='Quick search SKU / Nama...'/><div class='grid dashboard' id='dashboardCards'></div><div class='panel' id='recentMove'></div></section>`);document.getElementById('quickSearch').addEventListener('input',e=>{const q=e.target.value.trim();if(q)App.router.navigate('/search?q='+encodeURIComponent(q));});document.getElementById('dashboardCards').innerHTML=[["Kartu Stock",totals['Kartu Stock']],["RPL",totals['RPL']],["BULKY",totals['BULKY']],["Barang Masuk",totals['Barang Masuk']],["Barang Keluar",totals['Barang Keluar']].map(([k,v])=>`<div class='metric'><div class='k'>${k}</div><div class='v'>${v}</div></div>`).join('');},search(query=''){Render.layout(`<section class='panel'><h3 class='page-title'>Cari Data</h3><div class='search-bar'><input id='searchInput' class='search-lg' placeholder='Cari SKU, 4 digit akhir, nama barang'/></div><div class='toolbar'><div id='filterRow'></div></div><div id='results' style='margin-top:10px'></div></section>`);const input=document.getElementById('searchInput');input.value=query;input.addEventListener('input',Utils.debounce(()=>{runSearch(input.value);},220));renderFilters();runSearch(query);},detail(sku){const sel=[...App.state.cacheSku.values()].find(r=>Utils.clean(r.sku)===Utils.clean(sku));if(!sel){Render.layout(`<section class='panel'><h3 class='page-title'>Detail SKU</h3><div class='state'>SKU tidak ditemukan.</div><button class='btn-primary' id='backSearch'>Kembali ke Search</button></section>`);document.getElementById('backSearch').onclick=()=>App.router.navigate('/search');return;}const bySheet={};SHEETS.forEach(sheet=>bySheet[sheet]=(App.state.data[sheet]||[]).filter(r=>Utils.clean(Utils.getVal(r,['sku']))===Utils.clean(sel.sku)));let html=`<section class='panel'><h3 class='page-title'>Detail SKU</h3><div class='result-card'><strong>${Utils.esc(sel.nama)}</strong><div>SKU: ${Utils.esc(sel.sku)}</div><div class='row' style='margin-top:8px'><button class='btn-primary' id='backSearch'>Kembali ke Search</button></div></div>`;for(const sheet of SHEETS){const rows=bySheet[sheet]||[];html+=`<div class='panel'><div class='badge ${sheet==='Kartu Stock'?'b-kartu':sheet==='RPL'?'b-rpl':sheet==='BULKY'?'b-bulky':sheet==='Barang Masuk'?'b-in':'b-out'}'>${sheet}</div>${rows.length?Render.table(rows):"<div class='state'>Data kosong</div>"}</div>`;}html+='</section>';Render.layout(html);document.getElementById('backSearch').onclick=()=>App.router.navigate('/search');},table(rows){const headers=Object.keys(rows[0]||{});return `<div class='table-wrap'><table><thead><tr>${headers.map(x=>`<th>${Utils.esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${headers.map(k=>`<td>${Utils.esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;},statistics(){Render.layout(`<section class='panel'><h3 class='page-title'>Statistik</h3><div class='state'>Statistik tetap tersedia, data diolah dari memory cache.</div></section>`);},movement(){Render.layout(`<section class='panel'><h3 class='page-title'>Movement</h3><div class='state'>Movement tetap tersedia, data diolah dari memory cache.</div></section>`);},settings(){Render.layout(`<section class='panel'><h3 class='page-title'>Settings / Info</h3><p><strong>Status API:</strong> ${App.state.apiConnected?'Terhubung':'Tidak terhubung'}</p><p><strong>Data loaded:</strong> ${App.state.isLoaded?'Loaded':'Belum loaded'}</p><p><strong>Spreadsheet ID:</strong> <code>${SPREADSHEET_ID}</code></p><p><strong>Sheet digunakan:</strong> ${SHEETS.join(', ')}</p><div class='row'><button class='btn-primary' id='refresh'>Refresh Manual</button><button id='darkBtn'>Toggle Dark</button><button id='compactBtn'>Toggle Compact</button></div></section>`);document.getElementById('refresh').onclick=()=>Bootstrap.load(true);document.getElementById('darkBtn').onclick=()=>document.body.classList.toggle('dark');document.getElementById('compactBtn').onclick=()=>document.body.classList.toggle('compact');}};
Utils.debounce=(fn,wait)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),wait)}};
function renderFilters(){const row=document.getElementById('filterRow');if(!row)return;row.innerHTML=FILTERS.map(f=>`<button class='chip ${f===App.state.currentFilter?'active':''}' data-filter='${encodeURIComponent(f)}'>${Utils.esc(f)}</button>`).join('');row.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{App.state.currentFilter=decodeURIComponent(b.dataset.filter);renderFilters();runSearch(document.getElementById('searchInput').value);});}
function runSearch(qRaw){const q=Utils.clean(qRaw);const resultsEl=document.getElementById('results');if(!q){resultsEl.innerHTML="<div class='state'>Masukkan kata kunci pencarian.</div>";return;}const words=q.split(' ').filter(Boolean),out=[];for(const it of App.state.cacheSku.values()){if(App.state.currentFilter!=="Semua"&&!it.sources.has(App.state.currentFilter))continue;const skuN=Utils.clean(it.sku),nameN=Utils.clean(it.nama),combined=`${skuN} ${nameN}`;let rank=99;if(skuN===q)rank=1;else if(/^\d{4}$/.test(q)&&skuN.endsWith(q))rank=2;else if(skuN.includes(q))rank=3;else if(nameN.includes(q))rank=4;else if(words.length&&words.every(w=>combined.includes(w)))rank=5;else if(words.some(w=>combined.includes(w)))rank=6;if(rank<99)out.push({...it,sources:[...it.sources],rank});}
const items=out.sort((a,b)=>a.rank-b.rank).slice(0,50);resultsEl.innerHTML=items.length?`<div class='result-list'>${items.map(r=>`<div class='result-card'><div class='result-head'><div><strong>${Utils.esc(r.nama)}</strong><div>SKU: ${Utils.esc(r.sku)}</div></div></div><div class='row'><button class='btn-primary' data-sku='${encodeURIComponent(r.sku)}'>Lihat Detail</button></div></div>`).join('')}</div>`:"<div class='state'>Data tidak ditemukan.</div>";resultsEl.querySelectorAll('[data-sku]').forEach(btn=>btn.onclick=()=>App.router.navigate('/sku/'+decodeURIComponent(btn.dataset.sku)))}
function updateActive(path){document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',path===b.dataset.route||(path.startsWith('/sku/')&&b.dataset.route==='/search')))}
const Bootstrap={async load(manual=false){App.state.isLoading=true;Render.loading();document.getElementById('connText').textContent='Memuat data...';try{await Api.loadAllData();App.state.apiConnected=true;document.getElementById('lastSync').textContent='Sync: '+new Date().toLocaleTimeString('id-ID');document.getElementById('apiStatus').textContent='API: Terhubung';document.getElementById('connText').textContent='Koneksi API stabil';if(manual)Utils.toast('Data berhasil di-refresh');}catch(e){App.state.apiConnected=false;document.getElementById('apiStatus').textContent='API: Tidak terhubung';document.getElementById('connText').textContent='Koneksi API bermasalah';Render.layout(`<section class='panel'><div class='state error'>Gagal memuat data: ${Utils.esc(e.message)}</div></section>`);}finally{App.state.isLoading=false;App.router.resolve();}}};
function setupRouter(){App.router.on('/',()=>{if(!App.state.isLoaded)return Render.loading();updateActive('/');Render.dashboard();})
.on('/search',match=>{if(!App.state.isLoaded)return Render.loading();updateActive('/search');const p=new URLSearchParams(location.search);Render.search(p.get('q')||'');})
.on('/sku/:sku',match=>{if(!App.state.isLoaded)return Render.loading();updateActive('/search');Render.detail(match.data.sku);})
.on('/statistics',()=>{if(!App.state.isLoaded)return Render.loading();updateActive('/statistics');Render.statistics();})
.on('/movement',()=>{if(!App.state.isLoaded)return Render.loading();updateActive('/movement');Render.movement();})
.on('/settings',()=>{if(!App.state.isLoaded)return Render.loading();updateActive('/settings');Render.settings();})
.notFound(()=>{updateActive('');Render.notFound();})
.resolve();}
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();App.router.navigate(b.dataset.route)}));setupRouter();Bootstrap.load();setInterval(()=>Bootstrap.load(false),60000);});
</script>
</body>
</html>
