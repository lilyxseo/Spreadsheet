<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Inventory Dashboard</title>
<style>
body{font-family:Arial;background:#f4f6fb;margin:0;padding:20px;color:#111827}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box}
button{margin-top:10px;padding:12px 20px;border:0;border-radius:12px;background:#2563eb;color:white}
.item{padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.item:hover{background:#f3f4f6}
.muted{color:#6b7280}
table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
th,td{border:1px solid #ddd;padding:8px;font-size:13px;white-space:nowrap}
th{background:#f9fafb}
.badge{background:#dbeafe;color:#1d4ed8;padding:4px 8px;border-radius:999px;font-size:12px}
</style>
</head>

<body>

<div class="card">
  <h2>Inventory Dashboard</h2>
  <input id="searchInput" placeholder="Cari SKU / 4 digit SKU / nama barang" onkeydown="if(event.key==='Enter') searchData()">
  <button onclick="searchData()">Cari</button>
  <div id="status" class="muted">Loading data...</div>
</div>

<div class="card">
  <h3>Hasil Pencarian</h3>
  <div id="results" class="muted">Tunggu data dimuat.</div>
</div>

<div class="card">
  <h3>Detail SKU</h3>
  <div id="detail" class="muted">Detail akan tampil di sini.</div>
</div>

<script>
const API_KEY = "AIzaSyAhRpt5u-xx1ysTq_u4xOOziVHmlBJb34E";
const SPREADSHEET_ID = "1KzOcV1V4bcxfsLzhfwXxnIxxZoTRlKh4UYhNizREpCM";

const SHEETS = [
  "Kartu Stock",
  "RPL",
  "BULKY",
  "Barang Masuk",
  "Barang Keluar"
];

let DATA = {};

window.onload = loadAllData;

async function loadAllData(){
  for(const sheet of SHEETS){
    const range = `${sheet}!A1:Z10000`;
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;

    const res = await fetch(url);
    const json = await res.json();

    if(json.error){
      document.getElementById("status").innerHTML = `Error ${sheet}: ${json.error.message}`;
      return;
    }

    DATA[sheet] = parseSheet(json.values || []);
  }

  document.getElementById("status").innerHTML = "Data berhasil dimuat. Silakan cari SKU atau nama barang.";
  document.getElementById("results").innerHTML = "Masukkan keyword pencarian.";
}

function parseSheet(values){
  if(!values || values.length < 2) return [];

  let headerIndex = values.findIndex(row =>
    row.some(cell => clean(cell).includes("sku")) ||
    row.some(cell => clean(cell).includes("nama"))
  );

  if(headerIndex === -1) headerIndex = 2;

  const headers = values[headerIndex].map(h => clean(h));

  return values.slice(headerIndex + 1).map(row => {
    const obj = {};
    headers.forEach((h,i) => obj[h] = row[i] || "");
    return obj;
  });
}

function searchData(){
  const q = clean(document.getElementById("searchInput").value);
  if(!q) return;

  const words = q.split(" ").filter(Boolean);
  let results = [];

  ["Kartu Stock","RPL","BULKY","Barang Masuk","Barang Keluar"].forEach(sheet=>{
    (DATA[sheet] || []).forEach(row=>{
      const sku = getVal(row, ["sku"]);
      const nama = getVal(row, ["nama barang","nama","item name","description"]);
      const combined = clean(`${sku} ${nama}`);

      const match =
        clean(sku).includes(q) ||
        clean(nama).includes(q) ||
        (q.length === 4 && clean(sku).endsWith(q)) ||
        words.every(w => combined.includes(w));

      if(match && (sku || nama)){
        results.push({sku,nama,sheet});
      }
    });
  });

  const unique = {};
  results.forEach(r=>{
    const key = clean(r.sku || r.nama);
    if(!unique[key]) unique[key] = r;
  });

  renderResults(Object.values(unique).slice(0,30));
}

function renderResults(results){
  if(!results.length){
    document.getElementById("results").innerHTML = "Data tidak ditemukan.";
    return;
  }

  let html = `<b>${results.length} hasil ditemukan</b>`;

  results.forEach(r=>{
    html += `
      <div class="item" onclick="showDetail('${escAttr(r.sku)}')">
        <b>${esc(r.nama || "-")}</b><br>
        SKU: ${esc(r.sku || "-")}<br>
        <span class="badge">${esc(r.sheet)}</span>
      </div>
    `;
  });

  document.getElementById("results").innerHTML = html;

  if(results.length === 1) showDetail(results[0].sku);
}

function showDetail(sku){
  const key = clean(sku);

  const kartu = filterSku(DATA["Kartu Stock"], key);
  const rpl = filterSku(DATA["RPL"], key);
  const bulky = filterSku(DATA["BULKY"], key);
  const masuk = filterSku(DATA["Barang Masuk"], key);
  const keluar = filterSku(DATA["Barang Keluar"], key);

  let html = `<h2>SKU: ${esc(sku)}</h2>`;
  html += renderTable("Kartu Stock", kartu);
  html += renderTable("RPL", rpl);
  html += renderTable("BULKY", bulky);
  html += renderTable("Barang Masuk", masuk);
  html += renderTable("Barang Keluar", keluar);

  document.getElementById("detail").innerHTML = html;
}

function filterSku(rows, key){
  return (rows || []).filter(row => clean(getVal(row, ["sku"])) === key);
}

function renderTable(title, rows){
  if(!rows || !rows.length) return `<h3>${title}</h3><div class="muted">Tidak ada data.</div>`;

  const headers = Object.keys(rows[0]);
  let html = `<h3>${title}</h3><table><tr>`;

  headers.forEach(h => html += `<th>${esc(h)}</th>`);
  html += `</tr>`;

  rows.forEach(row=>{
    html += `<tr>`;
    headers.forEach(h => html += `<td>${esc(row[h] || "")}</td>`);
    html += `</tr>`;
  });

  html += `</table>`;
  return html;
}

function getVal(row, keys){
  for(const key of keys){
    const found = Object.keys(row).find(k => clean(k).includes(clean(key)));
    if(found && row[found]) return row[found];
  }
  return "";
}

function clean(v){
  return String(v || "").toLowerCase().trim().replace(/[_-]/g," ").replace(/\s+/g," ");
}

function esc(v){
  return String(v || "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function escAttr(v){
  return String(v || "").replace(/'/g,"\\'");
}
</script>

</body>
</html>
